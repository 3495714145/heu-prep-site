<!-- Generated by Trae Work -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>课表 · HEU 备考</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="nav" id="site-nav"></header>
<main>
  <section class="hero container">
    <h1>日粒度滚动课表</h1>
    <p class="sub">两个排课引擎：自考轨按考期倒排 + 选科；考研轨按阶段 + 每日时间权重。排课自 2026-11-03 起，每块标注具体钟点时段（上午 08:30 / 下午 14:30 / 晚上 19:00 起），你的完成/跳过/拖拽记录存于本地。</p>
  </section>

  <section class="section container" id="skip-nudge-box" style="display:none;">
    <div class="notice ref" id="skip-nudge"></div>
  </section>

  <section class="section container">
    <div class="sched-toolbar">
      <button id="sch-prev">← 上一天</button>
      <button id="sch-today">今天</button>
      <button id="sch-next">下一天 →</button>
      <span style="flex:1"></span>
      <button id="sch-week-toggle">切换本周概览</button>
    </div>
    <div id="sch-view"></div>
  </section>

  <section class="section container">
    <h2>课表设置</h2>
    <p class="desc">未选择自考科目时，自考引擎不生成课表，仅显示引导提示。其余科目不进入课表。</p>
    <div class="settings-grid">
      <div class="card">
        <h3>本次考期报考科目（2—4 门）</h3>
        <p class="muted">仅可选有公开结构信息（官方大纲或参考章节）的科目；不选则不生成自考课表。</p>
        <div class="check-list" id="zk-subject-list" style="margin-top:10px;"></div>
        <button class="btn small" id="zk-subject-save" style="margin-top:10px;">保存选科</button>
      </div>
      <div class="card">
        <h3>每周空白半日（至少一个）</h3>
        <p class="muted">引擎不在该时段排块。</p>
        <div style="margin-top:10px;display:flex;gap:10px;flex-wrap:wrap;">
          <select id="blank-weekday"></select>
          <select id="blank-slot">
            <option value="morning">上午</option>
            <option value="afternoon">下午</option>
            <option value="evening">晚上</option>
          </select>
          <button class="btn small" id="blank-save">保存</button>
        </div>
        <hr class="rule">
        <h3>数据</h3>
        <button class="btn small ghost" id="sch-reset" style="margin-top:8px;">清空所有课表本地记录</button>
      </div>
    </div>
  </section>
</main>
<footer id="site-footer"></footer>
<script src="js/data.js"></script>
<script src="js/common.js"></script>
<script src="js/schedule.js"></script>
  <script src="js/ai_float.js"></script>
</body>
</html>
